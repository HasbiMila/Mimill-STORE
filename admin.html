<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HPKU — Admin Katalog</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}header{background:#111827;color:white;padding:24px 6%}main{max-width:1000px;margin:30px auto;padding:0 20px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:10px}textarea{min-height:80px}button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}.muted{color:#667085;font-size:13px}.item{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #eee;align-items:center}.actions{display:flex;gap:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{display:block}.actions{margin-top:10px}}</style></head><body><header><h1>HPKU — Admin Katalog</h1><div>Editor untuk katalog GitHub Pages</div></header><main><div class="card"><h2>Tambah / Edit Produk</h2><p class="muted">Edit produk di sini, lalu klik <b>Download products.js</b>. Upload file tersebut ke GitHub untuk menerbitkan perubahan.</p><div class="grid"><div><label>Brand</label><select id="brand"></select></div><div><label>Nama HP</label><input id="name" placeholder="Galaxy S26 Ultra"></div><div><label>Harga</label><input id="price" type="number" placeholder="14999000"></div><div><label>RAM / ROM</label><input id="spec" placeholder="12GB / 256GB"></div><div><label>WhatsApp (628...)</label><input id="wa" placeholder="6281234567890"></div><div><label>URL foto</label><input id="image" placeholder="https://.../foto.jpg"></div><div class="full"><label>Catatan</label><textarea id="note" placeholder="5G, promo, warna tersedia..."></textarea></div></div><br><button class="primary" onclick="addProduct()">Tambah Produk</button> <button onclick="clearForm()">Bersihkan</button></div><div class="card"><h2>Produk</h2><div id="list"></div><br><button class="primary" onclick="downloadProducts()">Download products.js</button> <button onclick="downloadBackup()">Backup JSON</button></div></main><script src="products.js"></script><script>const brands=["Tecno","Infinix","vivo","OPPO","Samsung","Apple"];let data=JSON.parse(JSON.stringify(products)),editing=null;document.getElementById('brand').innerHTML=brands.map(x=>`<option>${x}</option>`).join('');function clearForm(){editing=null;name.value='';price.value='';spec.value='';wa.value='';image.value='';note.value=''}function addProduct(){const p={id:editing??Date.now(),brand:brand.value,name:name.value.trim(),price:Number(price.value||0),spec:spec.value.trim(),wa:wa.value.trim(),image:image.value.trim(),note:note.value.trim()};if(!p.name){alert('Nama HP wajib diisi.');return}const i=data.findIndex(x=>x.id===p.id);if(i>=0)data[i]=p;else data.unshift(p);clearForm();render()}function editProduct(id){const p=data.find(x=>x.id===id);editing=id;brand.value=p.brand;name.value=p.name;price.value=p.price;spec.value=p.spec||'';wa.value=p.wa||'';image.value=p.image||'';note.value=p.note||'';scrollTo(0,0)}function delProduct(id){if(confirm('Hapus produk ini?')){data=data.filter(x=>x.id!==id);render()}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){list.innerHTML=data.map(p=>`<div class="item"><div><b>${esc(p.brand)} — ${esc(p.name)}</b><div class="muted">Rp ${Number(p.price||0).toLocaleString('id-ID')} · ${esc(p.spec||'')}</div></div><div class="actions"><button onclick="editProduct(${p.id})">Edit</button><button class="danger" onclick="delProduct(${p.id})">Hapus</button></div></div>`).join('')||'<p class="muted">Belum ada produk.</p>'}function downloadProducts(){const body=data.map(p=>JSON.stringify(p)).join(',\n');download('products.js','// Katalog HPKU\nconst products = [\n'+body+'\n];\n','application/javascript')}function downloadBackup(){download('products-backup.json',JSON.stringify(data,null,2),'application/json')}function download(n,t,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}render();</script></body></html>
