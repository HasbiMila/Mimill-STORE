<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPKU — Toko HP Terpercaya</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f6f8fb;color:#172033}button,input,select{font:inherit}
.top{background:#101722;color:#fff}.bar{height:66px;display:flex;align-items:center;gap:24px;max-width:1240px;margin:auto;padding:0 18px}.logo{font-weight:900;font-size:21px;white-space:nowrap}.logo span{color:#19d393}.logo small{display:block;font-size:9px;color:#aab5c5}.search{flex:1;max-width:600px;background:#fff;border-radius:8px;display:flex}.search input{width:100%;border:0;outline:0;padding:12px;background:transparent}.contact{font-size:12px;white-space:nowrap}.nav{background:#182230}.navin{max-width:1240px;margin:auto;padding:0 18px;height:40px;display:flex;gap:34px;align-items:center}.nav a{color:#fff;text-decoration:none;font-size:12px}.wrap{max-width:1240px;margin:auto;padding:14px 18px}.hero{height:225px;border-radius:9px;background:linear-gradient(100deg,#08131f,#1b2b3a);color:white;padding:36px;display:flex;align-items:center;overflow:hidden;position:relative}.hero h1{font-size:36px;margin:5px 0}.hero p{margin:0;color:#cbd3dd}.phones{position:absolute;right:180px;bottom:-35px;display:flex}.phones i{width:78px;height:165px;border:3px solid #8793a3;border-radius:19px;background:linear-gradient(145deg,#3c4857,#111923);margin-left:-12px;transform:rotate(10deg)}.phones i:nth-child(2){height:190px;transform:rotate(-1deg)}.phones i:nth-child(3){height:175px;transform:rotate(-10deg)}.brands{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:15px 0}.brand{background:#fff;border:1px solid #dfe4ea;border-radius:8px;padding:15px;text-align:center;font-weight:900}.brand.active{outline:2px solid #2677d4}.layout{display:grid;grid-template-columns:190px 1fr;gap:18px}.filter{background:#fff;border:1px solid #dce2e9;border-radius:8px;padding:13px;height:max-content}.filter h3{margin:0 0 10px}.filter label{display:block;font-size:12px;margin:9px 0;color:#5d687b}.catalogHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.catalogHead h2{margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid #e0e5ec;border-radius:9px;overflow:hidden;box-shadow:0 3px 12px #1522350b}.pic{height:210px;background:#f8fafc;display:grid;place-items:center;position:relative}.pic img{width:100%;height:100%;object-fit:contain;padding:18px}.phone{width:82px;height:157px;border:3px solid #6d7888;border-radius:20px;background:linear-gradient(140deg,#343f4f,#111923);position:relative;box-shadow:0 15px 25px #0002}.camera{position:absolute;left:12px;top:14px;width:32px;height:32px;border-radius:10px;background:radial-gradient(circle,#101723 0 20%,#8994a3 23% 34%,#111823 37%)}.camera:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#111823;left:18px;top:19px}.mark{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:8px;color:#b3bdca;font-weight:900}.tag{position:absolute;left:9px;top:9px;background:#172230;color:#fff;border-radius:5px;padding:5px 7px;font-size:10px}.body{padding:12px}.brandtxt{font-size:9px;color:#8b96a7;text-transform:uppercase;font-weight:900}.name{font-weight:900;margin:4px 0;font-size:14px}.spec{display:inline-block;background:#edf2f7;border-radius:5px;padding:4px 6px;font-size:10px;color:#536074}.price{font-weight:900;margin:11px 0;font-size:16px}.wa{display:block;text-align:center;text-decoration:none;background:#0dad77;color:#fff;padding:9px;border-radius:7px;font-size:11px;font-weight:900}.empty{grid-column:1/-1;text-align:center;background:white;border:1px dashed #ccd4df;padding:40px;color:#718096}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}.phones{right:20px;opacity:.35}.brands{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.contact{display:none}.bar{gap:10px}.layout{grid-template-columns:1fr}.filter{display:none}.grid{grid-template-columns:repeat(2,1fr)}.hero{height:190px;padding:22px}.hero h1{font-size:27px}.phones{display:none}}
</style></head>
<body>
<div class="top"><div class="bar"><div class="logo">📱 HP<span>KU</span><small id="tagline">Toko HP Terpercaya</small></div><div class="search">⌕<input id="q" placeholder="Cari HP impianmu..." oninput="render()"></div><div class="contact">◉ WhatsApp<br><b id="waLabel">Hubungi Kami</b></div></div><div class="nav"><div class="navin"><a href="#">⌂ Beranda</a><a href="#products">Semua Produk</a><a href="#brands">Brand</a><a href="#about">Tentang Kami</a></div></div></div>
<main class="wrap"><section class="hero"><div><div style="font-size:11px;color:#8fecc9;font-weight:900">ETALASE TOKO HP</div><h1 id="heroTitle">HP Original 100%</h1><p id="heroSub">Harga Terbaik · Garansi Resmi · Proses Cepat</p></div><div class="phones"><i></i><i></i><i></i><i></i></div></section>
<section id="brands"><div class="brands" id="brandButtons"></div></section>
<div class="layout"><aside class="filter"><h3>Filter Produk</h3><input style="width:100%;padding:9px;border:1px solid #d8dee7;border-radius:7px" placeholder="Cari produk..." oninput="document.getElementById('q').value=this.value;render()"><hr><b style="font-size:12px">Brand</b><div id="checks"></div></aside>
<section id="products"><div class="catalogHead"><div><h2>Semua Produk <small id="count" style="font-size:11px;background:#edf1f5;padding:5px 8px;border-radius:20px">0</small></h2><div id="result" style="font-size:12px;color:#7b8799"></div></div><select id="sort" onchange="render()" style="padding:8px;border:1px solid #d8dee7;border-radius:7px"><option value="default">Terbaru</option><option value="low">Harga terendah</option><option value="high">Harga tertinggi</option><option value="name">Nama A-Z</option></select></div><div class="grid" id="grid"></div></section></div></main>
<script>
let products=[],settings={},brand="Semua";const brands=["Tecno","Infinix","vivo","OPPO","Samsung","Apple"];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
async function load(){let r=await fetch("/api/catalog");let d=await r.json();products=d.products;settings=d.settings;document.getElementById("tagline").textContent=settings.tagline;document.getElementById("heroTitle").textContent=settings.heroTitle;document.getElementById("heroSub").textContent=settings.heroSubtitle;document.getElementById("waLabel").textContent=settings.whatsapp;renderBrands();render()}
function wa(p){let n=(settings.whatsapp||"").replace(/\D/g,""),t=encodeURIComponent(`Halo, saya tertarik dengan ${p.brand} ${p.name}. Apakah masih tersedia? Harga ${rupiah(p.price)}.`);return `https://wa.me/${n}?text=${t}`}
function renderBrands(){document.getElementById("brandButtons").innerHTML=[["Semua","★"],...brands.map(b=>[b,b[0]])].map(x=>`<button class="brand ${brand==x[0]?"active":""}" onclick="brand='${x[0]}';renderBrands();render()">${x[1]}<br><small>${x[0]}</small></button>`).join("");document.getElementById("checks").innerHTML=brands.map(b=>`<label><input type="checkbox" ${brand==b?"checked":""} onchange="brand=this.checked?'${b}':'Semua';renderBrands();render()"> ${b}</label>`).join("")}
function render(){let q=(document.getElementById("q").value||"").toLowerCase();let a=products.filter(p=>(brand=="Semua"||p.brand==brand)&&(!q||`${p.brand} ${p.name} ${p.spec}`.toLowerCase().includes(q)));let s=document.getElementById("sort").value;if(s=="low")a.sort((x,y)=>x.price-y.price);if(s=="high")a.sort((x,y)=>y.price-x.price);if(s=="name")a.sort((x,y)=>x.name.localeCompare(y.name));document.getElementById("count").textContent=a.length;document.getElementById("result").textContent=`Menampilkan ${a.length} produk${brand=="Semua"?"":" dari "+brand}.`;document.getElementById("grid").innerHTML=a.length?a.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${esc(p.image)}">`:`<div class="phone"><span class="camera"></span><span class="mark">${esc(p.brand)}</span></div>`}<span class="tag">${esc(p.brand)}</span></div><div class="body"><div class="brandtxt">${esc(p.note)}</div><div class="name">${esc(p.name)}</div><span class="spec">${esc(p.spec)}</span><div class="price">${rupiah(p.price)}</div><a class="wa" href="${wa(p)}" target="_blank">◉ Chat via WhatsApp</a></div></article>`).join(""):`<div class="empty">Produk tidak ditemukan.</div>`}
load();
</script></body></html>
