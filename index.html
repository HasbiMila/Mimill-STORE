<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mimill STORE — Premium Smartphone</title><meta name="description" content="Mimill STORE — smartphone pilihan dengan layanan WhatsApp."><style>
:root{--bg:#050505;--panel:#0d0d0f;--panel2:#141417;--text:#f7f7f8;--muted:#a1a1aa;--line:#26262b;--gold:#d6b36a;--gold2:#f2d89b;--green:#25d366;--shadow:0 25px 80px rgba(0,0,0,.45)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#242018 0,#090909 35%,#050505 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.wrap{max-width:1240px;margin:auto;padding:0 22px}.nav{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07)}.navin{height:74px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:950;letter-spacing:-.6px}.logo span{color:var(--gold)}.navlinks{display:flex;gap:25px;color:#c9c9ce;font-size:13px}.navlinks a:hover{color:white}.hero{padding:54px 0 36px}.heroBox{position:relative;overflow:hidden;min-height:430px;border:1px solid #292722;border-radius:30px;background:linear-gradient(115deg,rgba(25,23,18,.98),rgba(10,10,11,.92));box-shadow:var(--shadow);display:flex;align-items:center;padding:54px}.heroBox:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-130px;top:-180px;background:radial-gradient(circle,rgba(214,179,106,.22),transparent 65%)}.heroBox:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:90px;bottom:-260px;border:1px solid rgba(214,179,106,.22)}.heroContent{position:relative;z-index:2;max-width:680px}.eyebrow{display:inline-flex;border:1px solid rgba(214,179,106,.35);color:var(--gold2);padding:8px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:1.5px}.hero h1{font-family:Georgia,serif;font-size:clamp(42px,7vw,78px);line-height:.98;margin:20px 0 16px;letter-spacing:-3px}.hero p{font-size:17px;color:#c6c6cb;max-width:580px;line-height:1.7;margin:0 0 28px}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{padding:13px 19px;border-radius:12px;font-weight:850;font-size:13px}.btnGold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0b0b0b}.btnDark{border:1px solid #38383e;background:#111114;color:white}.section{padding:25px 0 45px}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.kicker{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase}.section h2{font-family:Georgia,serif;font-size:32px;margin:6px 0 0}.section small{color:var(--muted)}.brands{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.brand{border:1px solid var(--line);background:linear-gradient(145deg,#111114,#0a0a0c);color:#d5d5da;border-radius:15px;padding:16px 8px;font-weight:800;cursor:pointer;transition:.2s}.brand:hover,.brand.active{border-color:rgba(214,179,106,.7);color:var(--gold2);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.25)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.search{flex:1;min-width:220px;background:#0d0d0f;border:1px solid var(--line);border-radius:13px;padding:13px 15px;color:white;outline:none}.select{background:#0d0d0f;border:1px solid var(--line);border-radius:13px;padding:0 14px;color:white;min-height:48px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(145deg,#111114,#0b0b0d);border:1px solid #242429;border-radius:20px;overflow:hidden;transition:.25s;box-shadow:0 15px 45px rgba(0,0,0,.18)}.card:hover{transform:translateY(-5px);border-color:#454139;box-shadow:0 25px 65px rgba(0,0,0,.35)}.photo{height:320px;background:radial-gradient(circle at 50% 35%,#27231b,#111114 45%,#09090b);display:flex;align-items:center;justify-content:center;position:relative}.photo img{width:100%;height:100%;object-fit:contain;padding:18px}.placeholder{font-size:74px;filter:grayscale(1);opacity:.35}.body{padding:19px}.tag{display:inline-block;color:var(--gold2);border:1px solid rgba(214,179,106,.25);background:rgba(214,179,106,.07);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.7px}.name{font-size:19px;font-weight:900;margin:11px 0 5px;line-height:1.25}.spec{color:var(--muted);font-size:13px;line-height:1.5}.price{font-size:22px;font-weight:950;margin:14px 0;color:#fff}.wa{display:block;text-align:center;padding:12px;border-radius:12px;background:var(--green);color:#061008;font-weight:950;font-size:13px}.wa:hover{filter:brightness(1.08)}.empty{text-align:center;padding:50px;border:1px dashed #303036;border-radius:18px;color:var(--muted);grid-column:1/-1}.foot{border-top:1px solid #1d1d20;padding:34px 0 70px;color:#85858c;font-size:13px}.floatwa{position:fixed;right:22px;bottom:22px;z-index:30;background:var(--green);color:#061008;padding:14px 18px;border-radius:999px;font-weight:950;box-shadow:0 15px 40px rgba(37,211,102,.22)}@media(max-width:900px){.brands{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:0 14px}.navlinks a:not(:last-child){display:none}.hero{padding-top:22px}.heroBox{min-height:470px;padding:30px 24px;border-radius:24px}.hero h1{font-size:48px;letter-spacing:-2px}.hero p{font-size:15px}.brands{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr;gap:10px}.photo{height:210px}.body{padding:13px}.name{font-size:15px}.price{font-size:17px}.wa{font-size:11px;padding:10px}.floatwa{right:14px;bottom:14px}.section h2{font-size:27px}}
</style></head><body><header class="nav"><div class="wrap navin"><div class="logo">Mimill <span>STORE</span></div><nav class="navlinks"><a href="#produk">Produk</a><a href="#brand">Brand</a></nav></div></header><main class="wrap"><section class="hero"><div class="heroBox"><div class="heroContent"><span class="eyebrow">PREMIUM SMARTPHONE STORE</span><h1 id="heroTitle">Mimill STORE</h1><p id="heroText">Temukan smartphone pilihan dengan harga terbaik dan pelayanan yang nyaman.</p><div class="actions"><a class="btn btnGold" href="#produk">Lihat Koleksi</a><a class="btn btnDark" id="heroWa" href="#" target="_blank">Chat WhatsApp</a></div></div></div></section><section class="section" id="brand"><div class="sectionHead"><div><div class="kicker">Koleksi</div><h2>Pilih Brand</h2></div><small id="count">Memuat produk...</small></div><div class="brands" id="brands"></div></section><section class="section" id="produk"><div class="sectionHead"><div><div class="kicker">Etalase</div><h2>Smartphone Pilihan</h2></div></div><div class="tools"><input class="search" id="q" placeholder="Cari nama HP, brand, RAM, ROM..."><select class="select" id="sort"><option value="new">Terbaru</option><option value="low">Harga terendah</option><option value="high">Harga tertinggi</option><option value="az">Nama A-Z</option></select></div><div class="grid" id="grid"></div></section><footer class="foot" id="foot">© Mimill STORE</footer></main><a class="floatwa" id="floatWa" href="#" target="_blank">💬 WhatsApp</a><script src="products.js"></script><script>
let all=Array.isArray(window.PRODUCTS)?window.PRODUCTS:[];let settings=window.SETTINGS||{};let brand='Semua';const brands=['Semua','Tecno','Infinix','vivo','OPPO','Samsung','Apple'];const $=id=>document.getElementById(id);function init(){const n=settings.shopName||'Mimill STORE';$('heroTitle').textContent=n;$('foot').textContent='© '+n+' — Semua hak dilindungi.';$('heroText').textContent=settings.heroText||'Temukan smartphone pilihan dengan harga terbaik dan pelayanan yang nyaman.';const wa=(settings.defaultWa||'').replace(/\D/g,'');if(wa){const link='https://wa.me/'+wa+'?text='+encodeURIComponent('Halo '+n+', saya ingin bertanya tentang produk HP.');$('heroWa').href=link;$('floatWa').href=link}else{$('heroWa').style.display='none';$('floatWa').style.display='none'}renderBrands();render()}function renderBrands(){$('brands').innerHTML=brands.map(b=>'<button class="brand '+(brand===b?'active':'')+'" onclick="setBrand('+JSON.stringify(b)+')">'+b+'</button>').join('')}function setBrand(b){brand=b;renderBrands();render()}function render(){let q=$('q').value.toLowerCase();let arr=all.filter(p=>(brand==='Semua'||p.brand===brand)&&((p.name||'')+' '+(p.brand||'')+' '+(p.spec||'')+' '+(p.note||'')).toLowerCase().includes(q));const s=$('sort').value;if(s==='low')arr.sort((a,b)=>(+a.price||0)-(+b.price||0));if(s==='high')arr.sort((a,b)=>(+b.price||0)-(+a.price||0));if(s==='az')arr.sort((a,b)=>(a.name||'').localeCompare(b.name||''));$('count').textContent=arr.length+' produk';$('grid').innerHTML=arr.map(card).join('')||'<div class="empty">Produk tidak ditemukan.</div>'}function card(p){const wa=(p.wa||settings.defaultWa||'').replace(/\D/g,'');const link=wa?'https://wa.me/'+wa+'?text='+encodeURIComponent('Halo Mimill STORE, saya tertarik dengan '+(p.name||'produk ini')+'. Apakah masih tersedia?'):'#';return '<article class="card"><div class="photo">'+(p.imageUrl?'<img src="'+esc(p.imageUrl)+'" alt="'+esc(p.name||'HP')+'" loading="lazy">':'<div class="placeholder">📱</div>')+'</div><div class="body"><span class="tag">'+esc(p.brand||'HP')+'</span><div class="name">'+esc(p.name||'Produk')+'</div><div class="spec">'+esc(p.spec||'')+'</div><div class="price">'+money(p.price)+'</div>'+(p.note?'<div class="spec" style="margin-bottom:12px">'+esc(p.note)+'</div>':'')+'<a class="wa" href="'+link+'" target="_blank" rel="noopener">💬 Tanya WhatsApp</a></div></article>'}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('q').addEventListener('input',render);$('sort').addEventListener('change',render);init();</script></body></html>
